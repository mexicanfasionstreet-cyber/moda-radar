name: Actualizar radar

on:
  schedule:
    # tres franjas, hora de Ciudad de México (UTC-6)
    - cron: "0 13 * * *"   # 07:00 CDMX · mañana
    - cron: "0 19 * * *"   # 13:00 CDMX · mediodía
    - cron: "0 1 * * *"    # 19:00 CDMX · noche
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar tambien en YouTube e Instagram"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "aggregate.py"
      - "capsule.py"
      - "publicar.py"
      - "ui.py"
      - "sources.json"
      - ".github/workflows/daily.yml"

permissions:
  contents: write   # guardar datos/ y digests/ en el repo, y subir la capsula al Release
  pages: write      # publicar el panel
  id-token: write   # lo exige actions/deploy-pages

concurrency:
  group: moda-radar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del video
        run: |
          if ! command -v ffprobe >/dev/null; then
            echo "instalando ffmpeg estatico"
            curl -fsSL --retry 2 --max-time 180 -o /tmp/ff.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              && tar -xJf /tmp/ff.tar.xz -C /tmp \
              && dir=$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*-static' | head -1) \
              && sudo cp "$dir/ffmpeg" "$dir/ffprobe" /usr/local/bin/ \
              || echo "descarga estatica fallida"
          fi
          if ! command -v ffprobe >/dev/null; then
            echo "respaldo: apt con limite de 90s"
            timeout 90 sudo apt-get update -qq || true
            timeout 90 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg || true
          fi
          if ! command -v ffprobe >/dev/null; then
            echo "::error::no hay ffmpeg y la capsula no puede montarse"
            exit 1
          fi
          ffprobe -version | head -1
          pip install --quiet edge-tts pillow

      - name: Determinar la franja
        id: franja
        run: |
          h=$(date -u +%H)
          if [ "$h" -lt 6 ]; then F=noche
          elif [ "$h" -lt 16 ]; then F=manana
          else F=mediodia
          fi
          echo "franja=$F" >> "$GITHUB_OUTPUT"
          echo "Franja: $F (UTC $h h)"

      - name: Agregar noticias y generar panel
        run: python aggregate.py --days 4

      - name: Generar la capsula del dia
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CAPSULE_VOICE: ${{ vars.CAPSULE_VOICE }}
        run: |
          mkdir -p datos
          if python capsule.py --franja "${{ steps.franja.outputs.franja }}" > datos/capsula.log 2>&1; then
            rm -f datos/capsula.log
          else
            echo "::warning::La capsula fallo; el detalle queda en datos/capsula.log"
            tail -40 datos/capsula.log
          fi

      - name: Generar la capsula de Mexico y LatAm
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CAPSULE_VOICE: ${{ vars.CAPSULE_VOICE }}
        run: |
          if python capsule.py --edicion latam --franja "${{ steps.franja.outputs.franja }}" > datos/capsula-latam.log 2>&1; then
            grep -E "candidatas|no hay noticias|Listo" datos/capsula-latam.log || true
            rm -f datos/capsula-latam.log
          else
            echo "::warning::La capsula LatAm fallo; el detalle queda en datos/capsula-latam.log"
            tail -40 datos/capsula-latam.log
          fi

      - name: Rehacer el panel con el enlace al video
        run: python aggregate.py --render-only

      - name: Publicar en YouTube e Instagram
        if: github.event_name == 'schedule' || inputs.publicar == true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_HOST: ${{ vars.IG_HOST }}
          IG_VERSION: ${{ vars.IG_VERSION }}
        run: |
          python publicar.py --franja "${{ steps.franja.outputs.franja }}" \
            || echo "::warning::La publicacion fallo; el panel y las capsulas siguen publicados"

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "moda-radar bot"
          git config user.email "actions@users.noreply.github.com"
          # los mp4 y portadas no se commitean (ver .gitignore): van al Release
          git add docs digests datos
          if git diff --cached --quiet; then
            echo "Sin cambios en esta edición."
          else
            git commit -m "radar: edicion $(date -u +%Y-%m-%d)"
            git push || (git pull --rebase --autostash && git push)
          fi

      - name: Archivar la capsula en el Release
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "60"   # capsulas que se conservan en el Release
        run: |
          shopt -s nullglob
          files=(docs/videos/*.mp4 docs/videos/*-portada.jpg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Hoy no hay capsula que archivar."
            exit 0
          fi
          gh release view capsulas >/dev/null 2>&1 || gh release create capsulas \
            --title "Cápsulas diarias" \
            --notes "Archivo de las cápsulas en vídeo. El robot sube una cada día y borra las más antiguas." \
            --latest=false
          gh release upload capsulas "${files[@]}" --clobber
          # rotacion: se borran los mp4 (y su portada) mas antiguos de cada edicion
          nombres=$(gh release view capsulas --json assets --jq '.assets[].name')
          for sufijo in "" "-latam"; do
            echo "$nombres" \
              | grep -E "^[0-9]{4}-[0-9]{2}-[0-9]{2}${sufijo}\.mp4$" | sort | head -n -"$KEEP" \
              | while read -r mp4; do
                  gh release delete-asset capsulas "$mp4" -y
                  gh release delete-asset capsulas "${mp4%.mp4}-portada.jpg" -y || true
                done
          done

      - name: Preparar la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
