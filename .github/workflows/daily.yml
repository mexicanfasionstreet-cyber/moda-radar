name: Actualizar radar

on:
  schedule:
    # 12:00 UTC = 04:00 en Los Ángeles / 07:00 en Nueva York / 13:00 en Madrid
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aggregate.py"
      - "capsule.py"
      - "ui.py"
      - "sources.json"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: moda-radar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del video
        run: |
          if ! command -v ffprobe >/dev/null; then
            echo "ffmpeg no disponible; probando apt con timeout corto"
            sudo apt-get update -qq -o Acquire::http::Timeout=20 -o Acquire::Retries=1 || true
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              -o Acquire::http::Timeout=20 ffmpeg || true
          fi
          if ! command -v ffprobe >/dev/null; then
            echo "apt no sirvio; descargando binario estatico"
            curl -fsSL --retry 2 --max-time 180 \
              -o /tmp/ff.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf /tmp/ff.tar.xz -C /tmp
            dir=$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*-static' | head -1)
            sudo cp "$dir/ffmpeg" "$dir/ffprobe" /usr/local/bin/
          fi
          ffprobe -version | head -1
          pip install --quiet edge-tts pillow

      - name: Agregar noticias y generar panel
        run: python aggregate.py --days 4

      - name: Generar la capsula del dia
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CAPSULE_VOICE: ${{ vars.CAPSULE_VOICE }}
        run: |
          mkdir -p datos
          if python capsule.py > datos/capsula.log 2>&1; then
            rm -f datos/capsula.log
          else
            echo "::warning::La capsula fallo; el detalle queda en datos/capsula.log"
            tail -40 datos/capsula.log
          fi

      - name: Rehacer el panel con el enlace al video
        run: python aggregate.py --render-only

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "moda-radar bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs digests datos
          if git diff --cached --quiet; then
            echo "Sin cambios en esta edición."
          else
            git commit -m "radar: edicion $(date -u +%Y-%m-%d)"
            git push || (git pull --rebase --autostash && git push)
          fi
